services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edubase_app
    restart: unless-stopped
    # Fix storage ownership at runtime — volume mounts override the image's build-time chown,
    # so php-fpm (www-data) would inherit host-owned directories and fail to write logs/cache.
    command: sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache && exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edubase.rule=Host(`edubase.fazleyrabbi.xyz`)"
      - "traefik.http.routers.edubase.entrypoints=web"
      - "traefik.http.services.edubase.loadbalancer.server.port=80"
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - traefik
      - edubase

  mysql:
    image: mysql:8.0
    container_name: edubase_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-edubase}
      MYSQL_USER: ${DB_USERNAME:-edubase}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edubase

  redis:
    image: redis:7-alpine
    container_name: edubase_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - edubase

volumes:
  mysql_data:
  redis_data:

networks:
  traefik:
    external: true
  edubase:
    driver: bridge
