services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edubase_app
    restart: unless-stopped
    # Fix storage ownership at runtime — volume mounts override the image's build-time chown,
    # so php-fpm (www-data) would inherit host-owned directories and fail to write logs/cache.
    command: sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache && ln -sf /var/www/html/storage/app/public /var/www/html/public/storage && exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edubase.rule=Host(`edubase.fazleyrabbi.xyz`)"
      - "traefik.http.routers.edubase.entrypoints=web"
      - "traefik.http.services.edubase.loadbalancer.server.port=80"
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      redis:
        condition: service_started
    networks:
      - traefik
      - edubase
      - mysql-shared

  redis:
    image: redis:7-alpine
    container_name: edubase_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - edubase

volumes:
  redis_data:

networks:
  traefik:
    external: true
  edubase:
    driver: bridge
  mysql-shared:
    external: true
