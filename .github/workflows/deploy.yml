name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, laravel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "Hostname: $(hostname)"
          echo "Runner: $(whoami)"
          echo "Docker: $(docker --version)"
          echo "Compose: $(docker compose version)"

      - name: Deploy to VPS
        run: |
          cd /home/fazley/apps/edubase
          git pull origin main
          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Post-deploy
        run: |
          docker exec edubase_app php artisan key:generate --force || true
          docker exec edubase_app php artisan migrate --force
          docker exec edubase_app php artisan config:cache
          docker exec edubase_app php artisan route:cache
          docker exec edubase_app php artisan view:cache

      - name: Health check
        run: |
          echo "=== Container Status ==="
          docker compose -f /home/fazley/apps/edubase/docker-compose.prod.yml ps
          echo "=== Deployment Complete ==="
